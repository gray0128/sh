name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    defaults:
      run:
        working-directory: vps_cli_optimized
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package release archive
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vps-cli dist/vps-cli
          tar -C dist -czf dist/vps-cli-linux-${{ matrix.arch }}.tar.gz vps-cli
          sha256sum dist/vps-cli-linux-${{ matrix.arch }}.tar.gz | awk '{print $1}' > dist/vps-cli-linux-${{ matrix.arch }}.tar.gz.sha256
          rm -f dist/vps-cli

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v6
        with:
          name: vps-cli-linux-${{ matrix.arch }}
          path: |
            vps_cli_optimized/dist/vps-cli-linux-${{ matrix.arch }}.tar.gz
            vps_cli_optimized/dist/vps-cli-linux-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7

      - name: Upload README
        uses: actions/upload-artifact@v6
        with:
          name: vps-cli-docs
          path: vps_cli_optimized/README.md
          retention-days: 7

      - name: Upload SKILL
        uses: actions/upload-artifact@v6
        with:
          name: vps-cli-skill
          path: vps_cli_optimized/SKILL.md
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: vps-cli-linux-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/vps-cli-linux-amd64.tar.gz
            dist/vps-cli-linux-amd64.tar.gz.sha256
            dist/vps-cli-linux-arm64.tar.gz
            dist/vps-cli-linux-arm64.tar.gz.sha256
