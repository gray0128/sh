name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: vps_cli_optimized
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-cli-${{ matrix.target }}
          path: vps_cli_optimized/target/${{ matrix.target }}/release/vps-cli
          retention-days: 7

      - name: Upload README
        uses: actions/upload-artifact@v4
        with:
          name: vps-cli-docs
          path: vps_cli_optimized/README.md
          retention-days: 7

      - name: Upload SKILL
        uses: actions/upload-artifact@v4
        with:
          name: vps-cli-skill
          path: vps_cli_optimized/SKILL.md
          retention-days: 7
