[package]
name = "vps_cli"
version = "0.3.4"
edition = "2021"

[[bin]]
name = "vps-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nix = { version = "0.27", features = ["user"] }
atty = "0.2"

# Additional dependencies for downloading and verifying sing-box
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
tar = "0.4"
